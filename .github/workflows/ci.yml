name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # nightly: fuzz + MIWG conformance (jobs gated on schedule)

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        # TEMPORARY: macOS/Windows disabled — restore the line below when re-enabled.
        os: [ubuntu-latest]
        # os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace

  # Node.js/WASM bindings (TASK-020, ADR-0009): native addon on three OSes
  # with CLI parity; the workspace-wide clippy/test job above already covers
  # compiling the binding crates on every runner.
  bindings:
    strategy:
      fail-fast: false
      matrix:
        # TEMPORARY: macOS/Windows disabled — restore the line below when re-enabled.
        os: [ubuntu-latest]
        # os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
      - name: build CLI (parity oracle for the addon)
        run: cargo build -p bpmn-cli
      - name: build native addon
        working-directory: npm/bpmn-viz
        run: npm run build
      - name: test native addon (fixture + CLI parity)
        working-directory: npm/bpmn-viz
        run: npm test

  # WASM artifact: nodejs/web builds plus the browser smoke (Linux only).
  bindings-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.99.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31
        with:
          key: wasm
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/bpmn-wasm/package-lock.json
      - run: npm --prefix crates/bpmn-wasm ci
      - name: install Playwright Chromium
        working-directory: crates/bpmn-wasm
        run: npm exec -- playwright install --with-deps chromium
      - name: build WASM (nodejs + web targets)
        run: npm --prefix npm/bpmn-viz run build:wasm
      - name: test WASM crate
        run: npm --prefix crates/bpmn-wasm test
      - name: browser smoke (Playwright Chromium)
        run: npm --prefix crates/bpmn-wasm run test:browser
      - name: test packaged WASM runtime
        run: npm --prefix npm/bpmn-viz run test:wasm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wasm-runtime
          path: npm/bpmn-viz/wasm/
          if-no-files-found: error


  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@9c67a826e39827395bfa619cd85cb2aaeb43cfaa

  # Nightly fuzz execution (TASK-014); runs on schedule only, never per PR.
  fuzz:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: nightly
      - name: install cargo-fuzz
        run: cargo install --locked cargo-fuzz
      - name: fuzz xml_parse
        run: cargo fuzz run xml_parse -- -max_len=65536 -max_total_time=300
      - name: fuzz render_document
        run: cargo fuzz run render_document -- -max_len=65536 -max_total_time=300

  # Scheduled MIWG conformance (ADR-0005): requires network; never blocks PRs.
  miwg:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31
      - name: download pinned fixtures
        run: scripts/download-fixtures.sh
      - name: validate pinned fixtures
        run: |
          cargo build -p bpmn-cli
          for f in external/*.bpmn; do
            target/debug/bpmn validate "$f"
          done
