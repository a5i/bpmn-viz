[workspace]
resolver = "2"
members = ["crates/*"]
# Bindings (bpmn-node, bpmn-wasm) are members but not default: root
# cargo build/test/clippy keeps covering the core crates only (ADR-0009).
default-members = [
  "crates/bpmn-cli",
  "crates/bpmn-layout",
  "crates/bpmn-model",
  "crates/bpmn-raster",
  "crates/bpmn-render",
  "crates/bpmn-scene",
  "crates/bpmn-svg",
  "crates/bpmn-validate",
  "crates/bpmn-xml",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/a5i/bpmn-viz"
rust-version = "1.99.0"

[workspace.dependencies]
bpmn-model = { path = "crates/bpmn-model" }
bpmn-xml = { path = "crates/bpmn-xml" }
bpmn-validate = { path = "crates/bpmn-validate" }
bpmn-scene = { path = "crates/bpmn-scene" }
bpmn-render = { path = "crates/bpmn-render" }
bpmn-svg = { path = "crates/bpmn-svg" }
bpmn-raster = { path = "crates/bpmn-raster" }
bpmn-layout = { path = "crates/bpmn-layout" }

quick-xml = "0.42"
kurbo = "0.13"
resvg = "0.49"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
strip = "debuginfo"
