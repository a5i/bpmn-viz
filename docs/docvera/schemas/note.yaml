schemaVersion: 1
documentType: note
identity:
  field: frontMatter.id
  uniqueWithin: workspace
frontMatter:
  type: object
  required: [id, type, title, status]
  additionalProperties: false
  properties:
    id:
      type: string
      pattern: "^DOC-[0-9]{3}$"
    type:
      enum: [note]
    title:
      type: string
      minLength: 1
    status:
      enum: [active, deprecated]
body:
  allowPreamble: true
  additionalSections: true
