[package]
name = "bpmn-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "BPMN render/inspect/validate command line interface"
publish = false

[[bin]]
name = "bpmn"
path = "src/main.rs"

[dependencies]
